name: build-and-publish

on:
  push:
    tags:
      - 'cpu-v*.*.*'
      - 'cuda-v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  docker_publish_cpu:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/cpu-')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Docker metadata (CPU)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},prefix=cpu-
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker_publish_cuda:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/cuda-')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Docker metadata (CUDA)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},prefix=cuda-
            type=raw,value=cuda

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CUDA
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile.cuda
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
